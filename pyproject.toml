[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-blame-factoryio-mvp"
version = "0.1.0"
description = "A telemetry normalization, residual detection, and model-blame MVP with Factory I/O, active-diagnosis, and toy-case experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
factoryio-web = ["httpx>=0.25"]
factoryio-opcua = ["asyncua>=1.0"]
factoryio-modbus = ["pymodbus>=3.6"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
